# PgDog client credentials. Dev-only values — match docker-compose Postgres.
# NOTE: without at least one user here, PgDog disables all pools.

[[users]]
name = "gridtokenx_user"
database = "gridtokenx"
password = "gridtokenx_password"

[[users]]
name = "gridtokenx_user"
database = "gridtokenx_noti"
password = "gridtokenx_password"

[[users]]
name = "gridtokenx_user"
database = "gridtokenx_migrate"
password = "gridtokenx_password"

[[users]]
name = "gridtokenx_user"
database = "gridtokenx_noti_migrate"
password = "gridtokenx_password"

# DB-per-service target DBs (routes in pgdog.toml).
[[users]]
name = "gridtokenx_user"
database = "gridtokenx_trading"
password = "gridtokenx_password"

[[users]]
name = "gridtokenx_user"
database = "gridtokenx_trading_migrate"
password = "gridtokenx_password"

[[users]]
name = "gridtokenx_user"
database = "gridtokenx_meter"
password = "gridtokenx_password"

[[users]]
name = "gridtokenx_user"
database = "gridtokenx_meter_migrate"
password = "gridtokenx_password"

[[users]]
name = "gridtokenx_user"
database = "gridtokenx_iam"
password = "gridtokenx_password"

[[users]]
name = "gridtokenx_user"
database = "gridtokenx_iam_migrate"
password = "gridtokenx_password"

[[users]]
name = "gridtokenx_user"
database = "gridtokenx_chain"
password = "gridtokenx_password"

[[users]]
name = "gridtokenx_user"
database = "gridtokenx_chain_migrate"
password = "gridtokenx_password"

# THBC settlement service. Both entries are required: pgdog authenticates
# per-database, so the `gridtokenx_thbc` / `gridtokenx_thbc_migrate` routes in
# pgdog.toml are unusable without them and the service fails startup with
# "password ... is wrong, or the database does not exist" — which reads like a
# credential problem rather than a missing pool.
[[users]]
name = "gridtokenx_user"
database = "gridtokenx_thbc"
password = "gridtokenx_password"

[[users]]
name = "gridtokenx_user"
database = "gridtokenx_thbc_migrate"
password = "gridtokenx_password"

# ERP Bridge. Same per-database rule as THBC above — both entries required.
[[users]]
name = "gridtokenx_user"
database = "erp_bridge"
password = "gridtokenx_password"

[[users]]
name = "gridtokenx_user"
database = "erp_bridge_migrate"
password = "gridtokenx_password"
