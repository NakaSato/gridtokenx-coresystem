services:
  # PostgreSQL Database for API (Primary)
  postgres:
    image: postgres:17-alpine
    container_name: gridtokenx-postgres
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "log_statement=mod"
      - "-c"
      - "log_duration=on"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      # Async commit (~0.6s data-loss window on hard crash/power-loss only;
      # graceful restart loses nothing). Tolerated in dev via the Outbox pattern
      # + chain-as-source-of-truth + idempotency (docs/RELIABILITY.md). Defaults
      # to the safe `on` so prod/CI never inherit async commit; dev opts into
      # `off` via PG_SYNCHRONOUS_COMMIT in .env.
      - "synchronous_commit=${PG_SYNCHRONOUS_COMMIT:-on}"
    ports:
      - "${POSTGRES_PRIMARY_PORT:-7001}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multi-db.sql:/docker-entrypoint-initdb.d/init-multi-db.sql:ro
    networks:
      - gridtokenx-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PgDog - Rust connection pooler / load balancer / sharder (https://docs.pgdog.dev)
  # Sole Postgres pooler for the stack (replaced PgBouncer). Every service points
  # its DATABASE_URL at pgdog:6432 (host: localhost:${PGDOG_PORT:-7003}).
  pgdog:
    image: ghcr.io/pgdogdev/pgdog:main
    container_name: gridtokenx-pgdog
    security_opt:
      - no-new-privileges:true
    command: ["pgdog", "--config", "/etc/pgdog/pgdog.toml", "--users", "/etc/pgdog/users.toml"]
    volumes:
      - ./docker/pgdog/pgdog.toml:/etc/pgdog/pgdog.toml:ro
      - ./docker/pgdog/users.toml:/etc/pgdog/users.toml:ro
    ports:
      - "${PGDOG_PORT:-7003}:6432"
    networks:
      - gridtokenx-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Redis Cache for API (Primary)
  redis:
    image: redis:7-alpine
    container_name: gridtokenx-redis
    security_opt:
      - no-new-privileges:true
    # AOF (appendonly) makes every write durable, not just periodic RDB
    # snapshots — device pubkeys (gridtokenx:devices:*:pubkey) survive a hard
    # restart instead of vanishing and 403-ing all signed telemetry until
    # re-onboarding. RDB save points kept as a secondary checkpoint.
    command: >-
      redis-server --appendonly yes --appendfsync everysec
      --save "3600 1 300 100 60 10000"
    environment:
      TZ: ${TZ}
    ports:
      - "${REDIS_PRIMARY_PORT:-7010}:6379"
    volumes:
      - redis_data:/data
    networks:
      - gridtokenx-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Dataset outgrew 768M (zone streams ~785k entries → ~1GB RDB) and
          # OOM-crash-looped (1515 restarts). Raised to fit; durable fix is
          # producer-side XADD MAXLEN to bound the zone streams.
          memory: 2G
        reservations:
          memory: 256M

  # Kafka cluster 1: Commands & Events (Low-volume, strict order, durable)
  kafka-cmd:
    image: apache/kafka:3.7.0
    container_name: gridtokenx-kafka-cmd
    security_opt:
      - no-new-privileges:true
    ports:
      - "${KAFKA_CMD_PORT:-9001}:9001"
      - "29001:29001"
    environment:
      TZ: ${TZ}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-cmd:9004
      KAFKA_LISTENERS: PLAINTEXT://:9001,PLAINTEXT_HOST://:29001,CONTROLLER://:9004
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-cmd:9001,PLAINTEXT_HOST://localhost:29001
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      # Bound JVM heap so the broker can't grow to the image default (-Xmx1G) and
      # OOM the 16GiB host when all three brokers run. Low-volume cluster → 512m.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka_cmd_data:/var/lib/kafka/data
    networks:
      - gridtokenx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9001"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Kafka cluster 2: Market Data & Telemetry (High-TPS, ephemeral)
  kafka-market:
    image: apache/kafka:3.7.0
    container_name: gridtokenx-kafka-market
    security_opt:
      - no-new-privileges:true
    ports:
      - "${KAFKA_MARKET_PORT:-9002}:9002"
      - "29002:29002"
    environment:
      TZ: ${TZ}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-market:9005
      KAFKA_LISTENERS: PLAINTEXT://:9002,PLAINTEXT_HOST://:29002,CONTROLLER://:9005
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-market:9002,PLAINTEXT_HOST://localhost:29002
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 10
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      # High-TPS market/telemetry cluster — slightly larger heap (768m) than the
      # cmd/audit brokers, still bounded well under the 1G image default.
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms384m"
    volumes:
      - kafka_market_data:/var/lib/kafka/data
    networks:
      - gridtokenx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1280M
        reservations:
          memory: 640M
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9002"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Kafka cluster 3: Audit (Regulatory events, long retention)
  kafka-audit:
    image: apache/kafka:3.7.0
    container_name: gridtokenx-kafka-audit
    security_opt:
      - no-new-privileges:true
    ports:
      - "${KAFKA_AUDIT_PORT:-9003}:9003"
      - "29003:29003"
    environment:
      TZ: ${TZ}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-audit:9006
      KAFKA_LISTENERS: PLAINTEXT://:9003,PLAINTEXT_HOST://:29003,CONTROLLER://:9006
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-audit:9003,PLAINTEXT_HOST://localhost:29003
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      # Low-volume audit cluster (long retention, few events) → 512m heap.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka_audit_data:/var/lib/kafka/data
    networks:
      - gridtokenx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9003"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # RabbitMQ Message Broker (Task Queues & RPC)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: gridtokenx-rabbitmq
    security_opt:
      - no-new-privileges:true
    ports:
      - "${RABBITMQ_PORT:-9030}:5672" # AMQP Protocol
      - "${RABBITMQ_MGMT_PORT:-9031}:15672" # Management UI
    environment:
      TZ: ${TZ}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-gridtokenx}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rabbitmq_secret_2025}
      RABBITMQ_DEFAULT_VHOST: /
      # Performance tuning
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK_RELATIVE: "0.6"
      RABBITMQ_DISK_FREE_LIMIT: "50MB"
      # Enable plugins
      RABBITMQ_PLUGINS: "rabbitmq_management rabbitmq_prometheus"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    #      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - gridtokenx-network
    restart: unless-stopped
    healthcheck:
      # check_port_connectivity verifies the AMQP 5672 listener actually accepts,
      # not just that the Erlang node is up (which `ping` does) — so dependents
      # gated on service_healthy (noti/iam/trading/aggregator) don't start in the
      # window before 5672 binds and crash-loop on "connection refused".
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5
      # 60s grace: check_port_connectivity exits 64 ("rabbit app not running")
      # until the broker fully boots — longer than `ping` took, so give the
      # rabbit app room to come up before failures count against health.
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # NATS JetStream - Blockchain TX Bus (chain.tx.submit / chain.tx.cancel / chain.tx.mint)
  nats:
    image: nats:2.10-alpine
    container_name: gridtokenx-nats
    security_opt:
      - no-new-privileges:true
    command:
      - "-c"
      - "/etc/nats/nats-server.conf"
    environment:
      # Consumed by nats_conf/nats-server.conf ($NATS_USER / $NATS_PASSWORD).
      # Overriding these requires also overriding NATS_URL on chain-bridge /
      # aggregator-bridge (their defaults embed the dev credentials below).
      NATS_USER: ${NATS_USER:-gridtokenx}
      NATS_PASSWORD: ${NATS_PASSWORD:-gridtokenx_nats_dev}
    ports:
      # Loopback-only: host tools (e2e suites, scripts) connect via
      # 127.0.0.1; nothing on the LAN can reach the broker.
      - "127.0.0.1:${NATS_CLIENT_PORT:-9020}:4222" # Client connections
      - "127.0.0.1:${NATS_MONITOR_PORT:-9021}:8222" # HTTP monitoring
    volumes:
      - nats_data:/data
      - ./nats_conf/nats-server.conf:/etc/nats/nats-server.conf:ro
    networks:
      - gridtokenx-network
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost — busybox wget can resolve localhost to ::1
      # while the server listens on IPv4 only.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 96M

  # Apache APISIX - User Gateway (Public Internet / Web Clients)
  apisix:
    image: apache/apisix:3.15.0-debian
    container_name: gridtokenx-apisix
    security_opt:
      - no-new-privileges:true
    environment:
      APISIX_STAND_ALONE: "true"
      # Consumed by apisix.yaml's jwt-auth consumer via ${{JWT_SECRET}} — same
      # value IAM signs with, so the gateway can verify IAM-issued tokens.
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4001:9080" # User Proxy HTTP
      - "8443:9443" # User Proxy HTTPS (self-signed dev cert, see apisix.yaml ssl)
      # No 9180 mapping: file-driven standalone disables the Admin API — nothing
      # listens there (see apisix_conf/ARCHITECTURE.md §3).
    volumes:
      - ./apisix_conf/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ./apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    networks:
      - gridtokenx-network
      - user-tier
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9080"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Dev-only APISIX Dashboard mirror (profile: ui, off by default) --------
  # The embedded Dashboard cannot run on the real gateway: file-driven
  # standalone mode disables the Admin API (apisix_conf/ARCHITECTURE.md §3).
  # This pair — traditional-mode APISIX + throwaway etcd — exists ONLY to serve
  # the Dashboard over a *mirror* of apisix_conf/apisix.yaml. No production
  # traffic routes through it; Dashboard edits touch only the mirror.
  #   docker compose --profile ui up -d      # start
  #   ./scripts/sync-apisix-ui.sh            # push current apisix.yaml
  #   http://localhost:8001/ui/              # key: gridtokenx-ui-admin-dev
  apisix-ui:
    image: apache/apisix:3.15.0-debian
    container_name: gridtokenx-apisix-ui
    profiles: ["ui"]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8001:9180" # Dashboard + Admin API — mirror only, localhost only
    volumes:
      - ./apisix_conf/ui/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    networks:
      - gridtokenx-network
    depends_on:
      apisix-ui-etcd:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  apisix-ui-etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: gridtokenx-apisix-ui-etcd
    profiles: ["ui"]
    command:
      - etcd
      - --data-dir=/tmp/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://apisix-ui-etcd:2379
    # No volume on purpose: the mirror is ephemeral — after a restart just
    # re-run scripts/sync-apisix-ui.sh.
    networks:
      - gridtokenx-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  chain-bridge:
    build:
      context: ./
      dockerfile: gridtokenx-chain-bridge/Dockerfile
    container_name: gridtokenx-chain-bridge
    security_opt:
      - no-new-privileges:true
    ports:
      - "${CHAIN_BRIDGE_GRPC_PORT:-5040}:5040"
      - "${CHAIN_BRIDGE_METRICS_PORT:-9464}:9464"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      CHAIN_BRIDGE_GRPC_PORT: 5040
      # Settlement-TPS tuning (see chain-bridge 7a75261). Mint slots hold for the
      # full sign→submit→confirm latency, so mint TPS ≈ concurrency ÷ latency.
      # Skip-preflight/presign-disable drop the two redundant per-tx simulations —
      # safe here because the mint path is idempotent behind the durable outbox.
      CHAIN_BRIDGE_MINT_CONCURRENCY: "${CHAIN_BRIDGE_MINT_CONCURRENCY:-64}"
      CHAIN_BRIDGE_SUBMIT_CONCURRENCY: "${CHAIN_BRIDGE_SUBMIT_CONCURRENCY:-32}"
      CHAIN_BRIDGE_SKIP_PREFLIGHT: "${CHAIN_BRIDGE_SKIP_PREFLIGHT:-true}"
      CHAIN_BRIDGE_PRESIGN_DISABLE: "${CHAIN_BRIDGE_PRESIGN_DISABLE:-true}"
      # External SNTP time source (gridtokenx_telemetry::time). Override per deploy
      # to an internal NTP, or set NTP_DISABLE=1 for OS-clock-only / air-gap.
      NTP_SERVERS: ${NTP_SERVERS:-time.cloudflare.com:123,time.google.com:123}
      # mTLS by default; run `just gen-certs` first. Set CHAIN_BRIDGE_INSECURE=true in .env to bypass.
      CHAIN_BRIDGE_INSECURE: "${CHAIN_BRIDGE_INSECURE:-false}"
      # Distinct Vault/keypair name for the mandatory REC-validator co-signature on
      # generation mints (energy-token two-party control: rec_key != authority, Custom
      # 6012). Its derived pubkey must be registered on-chain via add_rec_validator.
      CHAIN_BRIDGE_REC_VALIDATOR_KEY_NAME: "${CHAIN_BRIDGE_REC_VALIDATOR_KEY_NAME:-gridtokenx-rec-validator}"
      CHAIN_BRIDGE_TLS_CERT: /app/infra/certs/server.crt
      CHAIN_BRIDGE_TLS_KEY: /app/infra/certs/server.key
      CHAIN_BRIDGE_TLS_CA: /app/infra/certs/ca.crt
      # Reject NATS envelopes without a valid mTLS-key signature. Enforced by
      # default now that every publisher signs — submit/cancel via
      # blockchain-core's SignedEnvelope, and mint via the aggregator's
      # EnvelopeSigner (infra/mint.rs). Override to false only as a local-dev
      # escape hatch when running without client certs.
      CHAIN_BRIDGE_REQUIRE_SIGNED_NATS: "${CHAIN_BRIDGE_REQUIRE_SIGNED_NATS:-true}"
      SOLANA_RPC_URL: ${DOCKER_SOLANA_RPC_URL:-http://host.docker.internal:8899}
      NATS_URL: ${NATS_URL:-nats://gridtokenx:gridtokenx_nats_dev@nats:4222}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      # DB-per-service: Chain Bridge's own DB (audit hash-chain + effect dedup +
      # nonce pool). Boot runs its embedded sqlx migrations against this URL
      # (chain-bridge-persistence::db). Unset ⇒ in-memory fallbacks (single-replica).
      CHAIN_BRIDGE_DATABASE_URL: postgresql://gridtokenx_user:gridtokenx_password@pgdog:6432/gridtokenx_chain
    volumes:
      - ./infra/certs/server.crt:/app/infra/certs/server.crt:ro
      - ./infra/certs/server.key:/app/infra/certs/server.key:ro
      - ./infra/certs/ca.crt:/app/infra/certs/ca.crt:ro
    healthcheck:
      # BusyBox nc has no -z flag; -w 1 connect-probe returns 0 iff 5040 is open.
      test: ["CMD", "/usr/bin/busybox", "nc", "-w", "1", "127.0.0.1", "5040"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      nats:
        condition: service_healthy
      # Default mode (CHAIN_BRIDGE_INSECURE=false) signs via Vault Transit, so
      # the Vault service must be ready before the bridge serves signing ops.
      vault:
        condition: service_healthy
    networks:
      - gridtokenx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 192M

  iam-service:
    build:
      context: ./
      dockerfile: gridtokenx-iam-service/Dockerfile
    container_name: gridtokenx-iam-service
    security_opt:
      - no-new-privileges:true
    ports:
      - "${IAM_HTTP_PORT:-4010}:8080"
      - "${IAM_GRPC_PORT:-5010}:8090"
    environment:
      # DB-per-service Phase 3: IAM owns its identity DB gridtokenx_iam
      # (migrate! runner switched to migrations-iam/ — 4 tables + user_role).
      DATABASE_URL: postgresql://gridtokenx_user:gridtokenx_password@pgdog:6432/gridtokenx_iam
      # sqlx::migrate! at startup uses a dedicated session-mode pooler alias so
      # its advisory lock can't leak into the transaction-mode pool above.
      MIGRATION_DATABASE_URL: postgresql://gridtokenx_user:gridtokenx_password@pgdog:6432/gridtokenx_iam_migrate
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      REDIS_URL: redis://redis:6379
      KAFKA_CMD_BROKERS: kafka-cmd:9001
      KAFKA_MARKET_BROKERS: kafka-market:9002
      KAFKA_AUDIT_BROKERS: kafka-audit:9003
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-gridtokenx}:${RABBITMQ_DEFAULT_PASS:-rabbitmq_secret_2025}@rabbitmq:5672
      IAM_PORT: 8080
      IAM_GRPC_PORT: 8090
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      RUST_LOG: debug,librdkafka=warn
      # Caps concurrent Argon2 hashes (~19MiB working memory each at default
      # cost params). Default 32 let bursty concurrency pile up ~600MiB+ of
      # simultaneous hash memory on top of per-connection overhead, OOM-killing
      # the container at the 2G limit under concurrency=50 register bursts
      # (docker events: container oom -> die exitCode=137). Lower cap queues
      # excess requests on the semaphore instead of allocating all at once.
      AUTH_CPU_SEMAPHORE_LIMIT: "16"
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
      API_KEY_SECRET: ${API_KEY_SECRET}
      ENVIRONMENT: development
      # Welcome airdrop: grant 10 GRX on-chain (Registry claim_airdrop, signed
      # by SOLANA_PAYER_KEY = registry authority) to each account right after
      # email verification. Best-effort + detached, so it never blocks or fails
      # verification; idempotent on-chain (AirdropAlreadyClaimed).
      IAM_VERIFY_GRANT_GRX: ${IAM_VERIFY_GRANT_GRX:-true}
      # Auth rate-limit budgets ("limit,window_secs"). Dev raises the tight prod
      # register cap (5/hour) so a large simulator fleet can onboard in one boot.
      IAM_REGISTER_LIMIT: ${IAM_REGISTER_LIMIT:-20,60}
      IAM_LOGIN_LIMIT: ${IAM_LOGIN_LIMIT:-10000,60}
      # /verify has its own budget so a bulk onboard raise doesn't also loosen
      # the shared general bucket that /forgot-password and /reset-password use.
      IAM_VERIFY_LIMIT: ${IAM_VERIFY_LIMIT:-10000,60}
      NTP_SERVERS: ${NTP_SERVERS:-time.cloudflare.com:123,time.google.com:123}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      VAULT_TRANSIT_KEY_NAME: gridtokenx-user-wallets
      CHAIN_BRIDGE_URL: ${CHAIN_BRIDGE_URL:-http://chain-bridge:5040}
      CHAIN_BRIDGE_INSECURE: "${CHAIN_BRIDGE_INSECURE:-false}"
      CHAIN_BRIDGE_CA_CERT: /app/infra/certs/ca.crt
      CHAIN_BRIDGE_CLIENT_CERT: /app/infra/certs/client.crt
      CHAIN_BRIDGE_CLIENT_KEY: /app/infra/certs/client.key
      CHAIN_BRIDGE_TLS_DOMAIN: chain-bridge
      CHAIN_BRIDGE_SERVICE_IDENTITY: spiffe://gridtokenx.th/prod/iam-service
      SOLANA_PAYER_KEY: ${SOLANA_PAYER_KEY}
      SOLANA_REGISTRY_PROGRAM_ID: ${SOLANA_REGISTRY_PROGRAM_ID}
      SOLANA_TRADING_PROGRAM_ID: ${SOLANA_TRADING_PROGRAM_ID}
      SOLANA_ORACLE_PROGRAM_ID: ${SOLANA_ORACLE_PROGRAM_ID}
      SOLANA_GOVERNANCE_PROGRAM_ID: ${SOLANA_GOVERNANCE_PROGRAM_ID}
      SOLANA_ENERGY_TOKEN_PROGRAM_ID: ${SOLANA_ENERGY_TOKEN_PROGRAM_ID}
      ENERGY_TOKEN_MINT: ${ENERGY_TOKEN_MINT}
      CURRENCY_TOKEN_MINT: ${CURRENCY_TOKEN_MINT}
      SOLANA_CLUSTER: ${SOLANA_CLUSTER:-localnet}
      AUTHORITY_WALLET_PATH: /app/dev-wallet.json
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TLS_MODE: none
      SMTP_FROM: noreply@gridtokenx.com
      ENABLE_EMAIL_VERIFICATION: "true"
      EMAIL_VERIFICATION_REQUIRED: "true"
      EMAIL_VERIFICATION_BASE_URL: http://localhost:4001
      OWS_VAULT_PATH: /var/lib/gridtokenx/ows-vault
    volumes:
      - ./dev-wallet.json:/app/dev-wallet.json
      - iam_ows_vault:/var/lib/gridtokenx/ows-vault
      - ./infra/certs/ca.crt:/app/infra/certs/ca.crt:ro
      - ./infra/certs/clients/iam-service.crt:/app/infra/certs/client.crt:ro
      - ./infra/certs/clients/iam-service.key:/app/infra/certs/client.key:ro
    depends_on:
      pgdog:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      chain-bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - gridtokenx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 2G: 768M OOM-crash-looped under background simulator load +
          # concurrent Argon2 register hashing (19 MiB per in-flight hash);
          # 1536M still OOMed once during a 15k-user bulk onboard (resident
          # memory grows with cumulative request count — suspected leak, see
          # scale-mint benchmark notes).
          memory: 2G
        reservations:
          memory: 256M

  # Meter Service - Smart Energy Dashboard read API (meters + meter_readings)
  meter-service:
    build:
      context: ./gridtokenx-meter-service
      dockerfile: Dockerfile
    container_name: gridtokenx-meter-service
    security_opt:
      - no-new-privileges:true
    ports:
      - "${METER_SERVICE_PORT:-4062}:8080"
    environment:
      # DB-per-service Phase 2: meter-service owns meters/registry in gridtokenx_meter;
      # owner wallet now resolved via meter_owner_read_model (users JOIN removed, fa3f537).
      DATABASE_URL: postgresql://gridtokenx_user:gridtokenx_password@pgdog:6432/gridtokenx_meter
      JWT_SECRET: ${JWT_SECRET}
      METER_EVENTS_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka-market:9002
      METER_EVENTS_TOPIC: meter_events
      METER_SERVICE_PORT: 8080
      RUST_LOG: info,sqlx=warn
    depends_on:
      pgdog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - gridtokenx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Trading Service
  trading-service:
    build:
      context: ./
      dockerfile: gridtokenx-trading-service/Dockerfile
    container_name: gridtokenx-trading-service
    security_opt:
      - no-new-privileges:true
    labels:
      # OrbStack's https://trading-service.gridtokenx-coresystem.orb.local domain
      # must hit the REST API (8093), not the ConnectRPC/gRPC port it auto-picks.
      dev.orbstack.http-port: "8093"
    ports:
      - "${TRADING_GRPC_PORT:-5020}:8092"
      - "${TRADING_HTTP_PORT:-4020}:8093"
    volumes:
      - ./dev-wallet.json:/app/dev-wallet.json
      - ./infra/certs/ca.crt:/app/infra/certs/ca.crt:ro
      - ./infra/certs/clients/trading-service-api.crt:/app/infra/certs/client.crt:ro
      - ./infra/certs/clients/trading-service-api.key:/app/infra/certs/client.key:ro
    environment:
      # DB-per-service Phase 1 cutover: Trading owns gridtokenx_trading.
      DATABASE_URL: postgresql://gridtokenx_user:gridtokenx_password@pgdog:6432/gridtokenx_trading
      REDIS_URL: redis://redis:6379
      KAFKA_CMD_BROKERS: kafka-cmd:9001
      KAFKA_MARKET_BROKERS: kafka-market:9002
      KAFKA_AUDIT_BROKERS: kafka-audit:9003
      KAFKA_BROKERS: kafka-cmd:9001
      # Publish domain events to Kafka (off by default → Redis Streams only).
      # noti-service consumes `${KAFKA_TOPIC_PREFIX}.triggers` for price alerts.
      KAFKA_EVENTS_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka-cmd:9001
      KAFKA_TOPIC_PREFIX: trading
      # DB-per-service read-model feed: project IAM wallet + meter events into the
      # trading-local read-model tables (iam_wallet_read_model, meter_read_model).
      # iam.user.events is on kafka-cmd (KAFKA_BOOTSTRAP_SERVERS above); meter_events
      # is on kafka-market, so the feed runs a second consumer there.
      TRADING_READMODEL_FEED: "true"
      READMODEL_METER_BROKERS: kafka-market:9002
      # Boot-backfill source DBs (post DB-split the source tables no longer live
      # in gridtokenx_trading). Read-only snapshot of user_wallets / meters.
      READMODEL_IAM_DATABASE_URL: postgresql://gridtokenx_user:gridtokenx_password@pgdog:6432/gridtokenx_iam
      READMODEL_METER_DATABASE_URL: postgresql://gridtokenx_user:gridtokenx_password@pgdog:6432/gridtokenx_meter
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      NTP_SERVERS: ${NTP_SERVERS:-time.cloudflare.com:123,time.google.com:123}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-gridtokenx}:${RABBITMQ_DEFAULT_PASS:-rabbitmq_secret_2025}@rabbitmq:5672
      # Per-crate debug, not global. A bare `debug` made 99.99% of this service's
      # output library noise: of 43,754 DEBUG lines in one 3h run, 35,154 were
      # sqlx::query echoing every poll of the 1s matcher / 10s settlement loops,
      # and only 4 came from a trading_* crate. sqlx stays at warn so the genuinely
      # useful `slow statement` alerts survive the cut.
      RUST_LOG: ${TRADING_RUST_LOG:-info,trading_api=debug,trading_core=debug,trading_infra=debug,trading_logic=debug,trading_persistence=debug,trading_service=debug,gridtokenx_blockchain_core=debug,sqlx=warn,librdkafka=warn}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
      SOLANA_RPC_URL: ${DOCKER_SOLANA_RPC_URL:-http://host.docker.internal:8899}
      CHAIN_BRIDGE_URL: ${CHAIN_BRIDGE_URL:-http://chain-bridge:5040}
      CHAIN_BRIDGE_INSECURE: "${CHAIN_BRIDGE_INSECURE:-false}"
      CHAIN_BRIDGE_CA_CERT: /app/infra/certs/ca.crt
      CHAIN_BRIDGE_CLIENT_CERT: /app/infra/certs/client.crt
      CHAIN_BRIDGE_CLIENT_KEY: /app/infra/certs/client.key
      CHAIN_BRIDGE_TLS_DOMAIN: chain-bridge
      CHAIN_BRIDGE_SERVICE_IDENTITY: spiffe://gridtokenx.th/prod/trading-service/api
      SOLANA_PAYER_KEY: ${SOLANA_PAYER_KEY}
      SOLANA_WS_URL: ${SOLANA_WS_URL:-ws://host.docker.internal:8002}
      IAM_SERVICE_URL: http://apisix:9080
      INTERNAL_API_KEY: ${ENGINEERING_API_KEY:-engineering-department-api-key-2025}
      SOLANA_CLUSTER: ${SOLANA_CLUSTER:-localnet}
      SOLANA_REGISTRY_PROGRAM_ID: ${SOLANA_REGISTRY_PROGRAM_ID}
      SOLANA_TRADING_PROGRAM_ID: ${SOLANA_TRADING_PROGRAM_ID}
      SOLANA_ORACLE_PROGRAM_ID: ${SOLANA_ORACLE_PROGRAM_ID}
      SOLANA_GOVERNANCE_PROGRAM_ID: ${SOLANA_GOVERNANCE_PROGRAM_ID}
      SOLANA_ENERGY_TOKEN_PROGRAM_ID: ${SOLANA_ENERGY_TOKEN_PROGRAM_ID}
      ENERGY_TOKEN_MINT: ${ENERGY_TOKEN_MINT}
      # Custodial settlement (Option A): currency mint + collector wallets the
      # settlement + custodial-funding paths read. Without these the settlement
      # builder fails at parse (empty pubkey). Collectors default to the platform
      # payer so their currency ATAs are platform-controlled.
      CURRENCY_TOKEN_MINT: ${CURRENCY_TOKEN_MINT:-AzFyFd4GkmjqBnJ5EYv7mkaeufAKkZffumjtDRrX425k}
      # Which SPL program owns CURRENCY_TOKEN_MINT. Treasury THBC is Token-2022;
      # the legacy stand-in currency mint was classic SPL. Wrong value ⇒ currency
      # ATAs derive to different addresses and every settlement transfer fails.
      CURRENCY_TOKEN_PROGRAM: ${CURRENCY_TOKEN_PROGRAM:-spl}
      FEE_COLLECTOR_WALLET: ${FEE_COLLECTOR_WALLET:-EzudwoHvNPAc4dpPi5ndU8MEZVHVzq3Pj3Thm9ooKmiJ}
      WHEELING_COLLECTOR_WALLET: ${WHEELING_COLLECTOR_WALLET:-EzudwoHvNPAc4dpPi5ndU8MEZVHVzq3Pj3Thm9ooKmiJ}
      LOSS_COLLECTOR_WALLET: ${LOSS_COLLECTOR_WALLET:-EzudwoHvNPAc4dpPi5ndU8MEZVHVzq3Pj3Thm9ooKmiJ}
      AUTHORITY_WALLET_PATH: /app/dev-wallet.json
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TLS_MODE: none
      SMTP_FROM: noreply@gridtokenx.com
      ENABLE_EMAIL_VERIFICATION: "true"
      EMAIL_VERIFICATION_REQUIRED: "true"
      EMAIL_VERIFICATION_BASE_URL: http://localhost:4001
      AES_KEY_BASE64: ${AES_KEY_BASE64}
      PAYER_PRIVATE_KEY: ${PAYER_PRIVATE_KEY}
      AGGREGATOR_BRIDGE_PUBLIC_KEY: ${AGGREGATOR_BRIDGE_PUBLIC_KEY:-}
      # Cross-service double-mint guard: aggregator-bridge owns generation issuance
      # (MINT_VIA_CHAIN_BRIDGE=true below). Disable trading's OracleConsumer mint
      # path so the same readings are not minted twice. See trading-service memory
      # note "trading-mint-two-paths-double-mint".
      ORACLE_MINT_ENABLED: "false"
      # On-chain atomic-swap trade settlement. Enabled for the Option A custodial
      # leg: order submit now records the order PDA + funds the escrow on-chain
      # (platform-signed), making settlement worker eligible. Swap path proven green
      # (execute-settlement.ts) + custodial instructions verified on-chain.
      TRADE_SETTLEMENT_ENABLED: "true"
    depends_on:
      pgdog:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      iam-service:
        condition: service_healthy
      chain-bridge:
        condition: service_healthy
    networks:
      - gridtokenx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 384M
    healthcheck:
      test: ["CMD", "/usr/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8093/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # Aggregator Bridge + IoT Ingestion Gateway
  aggregator-bridge:
    build:
      context: ./
      dockerfile: gridtokenx-aggregator-bridge/Dockerfile
    container_name: gridtokenx-aggregator-bridge
    security_opt:
      - no-new-privileges:true
    ports:
      - "${IOT_GATEWAY_PORT:-4030}:4010" # REST API
      - "${GRPC_PORT:-50051}:50051" # gRPC ingestion (smart meter simulator)
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      RUST_LOG: debug,librdkafka=warn
      # Container defaults GRPC_PORT=5030; pin to 50051 so the host port mapping
      # above actually reaches the gRPC ingestion listener.
      GRPC_PORT: 50051
      # Settlement-mint throughput tuning (pairs with chain-bridge's
      # CHAIN_BRIDGE_MINT_CONCURRENCY). MINT_INFLIGHT_LIMIT bounds concurrent
      # mint request-replies so the bridge queue never crosses its 55s staleness
      # cutoff; the 5s sweep/retry cadence keeps permits busy instead of firing
      # 30s waves (measured: 30s cadence idled ~70% of the window at 10k scale).
      MINT_INFLIGHT_LIMIT: "${MINT_INFLIGHT_LIMIT:-128}"
      BILLING_FLUSH_INTERVAL_SECS: "${BILLING_FLUSH_INTERVAL_SECS:-5}"
      MINT_RETRY_INTERVAL_SECS: "${MINT_RETRY_INTERVAL_SECS:-5}"
      NTP_SERVERS: ${NTP_SERVERS:-time.cloudflare.com:123,time.google.com:123}
      REDIS_URL: redis://redis:6379
      # Bound the per-zone Redis streams. Default is 100k/stream; with 10 zones +
      # the unified stream that is ~1.1M entries (~1GB) and OOM-crash-loops the
      # 2G redis. 10k/stream (~110k total, ~150MB) keeps recent telemetry for
      # dissemination/e2e without unbounded growth.
      REDIS_STREAM_MAXLEN: ${REDIS_STREAM_MAXLEN:-10000}
      KAFKA_CMD_BROKERS: kafka-cmd:9001
      KAFKA_MARKET_BROKERS: kafka-market:9002
      KAFKA_AUDIT_BROKERS: kafka-audit:9003
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-gridtokenx}:${RABBITMQ_DEFAULT_PASS:-rabbitmq_secret_2025}@rabbitmq:5672
      DATABASE_URL: postgresql://gridtokenx_user:gridtokenx_password@pgdog:6432/gridtokenx
      TRADING_DATABASE_URL: postgresql://gridtokenx_user:gridtokenx_password@pgdog:6432/gridtokenx
      # DB-per-service Phase 2: aggregator metering pool = gridtokenx_meter
      # (own_meter_db seam — reads meter_owner_read_model, not meters⋈users).
      METER_DATABASE_URL: postgresql://gridtokenx_user:gridtokenx_password@pgdog:6432/gridtokenx_meter
      AGGREGATOR_OWNER_READMODEL_FEED: "true"
      # iam.user.events lives on the kafka-cmd cluster (IAM + noti consume there),
      # while meter_events is on this service's KAFKA_BOOTSTRAP_SERVERS (kafka-market).
      # Point the read-model feed's IAM consumer at kafka-cmd so live wallet events
      # (link / primary-change / unlink) propagate to meter_owner_read_model, not just
      # the wallet embedded in meter_events + the backfill backstop.
      READMODEL_IAM_BROKERS: kafka-cmd:9001
      API_GATEWAY_URL: http://apisix:9080
      IAM_GRPC_URL: http://apisix:9080
      TRADING_GRPC_URL: http://apisix:9080
      GRIDTOKENX_API_KEYS: ${ENGINEERING_API_KEY:-engineering-department-api-key-2025},e2e-test-key
      # HTTP settlement fallback (only fires when MINT_VIA_CHAIN_BRIDGE can't): must
      # hit trading-service directly on the mesh. Routing it through apisix:9080 (the
      # user-facing gateway) 401s — apisix enforces jwt-auth; the bridge authenticates
      # to trading as an internal ApiGateway caller via x-gridtokenx-gateway-secret.
      SETTLEMENT_API_URL: http://trading-service:8093
      AGGREGATOR_BRIDGE_SIGNING_KEY: /app/aggregator-bridge-signing-key.bin
      NATS_URL: ${NATS_URL:-nats://gridtokenx:gridtokenx_nats_dev@nats:4222}
      KAFKA_BOOTSTRAP_SERVERS: kafka-market:9002
      KAFKA_TOPIC_METER_READINGS: meter.readings
      # Independent realtime telemetry history — dedicated InfluxDB v2 instance
      # owned by this service alone (not shared with any other service).
      INFLUXDB_URL: http://aggregator-influxdb:8086
      INFLUXDB_ORG: ${INFLUXDB_ORG:-gridtokenx}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-aggregator_telemetry}
      INFLUXDB_TOKEN: ${AGGREGATOR_INFLUXDB_TOKEN:-aggregator-bridge-dev-token}
      # Path B generation-mint via Chain Bridge: aggregator builds UNSIGNED GRID mint
      # tx and submits over NATS; Chain Bridge (Vault platform_admin) signs + sends.
      MINT_VIA_CHAIN_BRIDGE: "true"
      CHAIN_BRIDGE_URL: http://chain-bridge:5040
      CHAIN_BRIDGE_INSECURE: "${CHAIN_BRIDGE_INSECURE:-false}"
      CHAIN_BRIDGE_CA_CERT: /app/infra/certs/ca.crt
      CHAIN_BRIDGE_CLIENT_CERT: /app/infra/certs/client.crt
      CHAIN_BRIDGE_CLIENT_KEY: /app/infra/certs/client.key
      CHAIN_BRIDGE_TLS_DOMAIN: chain-bridge
      CHAIN_BRIDGE_SERVICE_IDENTITY: spiffe://gridtokenx.th/prod/aggregator-bridge
      SOLANA_RPC_URL: http://host.docker.internal:8899
      # IAM gRPC (ConnectRPC) for GetUserWallet — the mint path resolves each bin's
      # recipient wallet here. The identity client reads IAM_SERVICE_URL (not IAM_GRPC_URL).
      IAM_SERVICE_URL: http://iam-service:8090
      # Fleet-scale mint bursts: a short reply budget re-enters the outbox and
      # amplifies republish churn (congestion collapse at a 25k single-window
      # burst — see docs/scale-mint-onchain-results.md). 120s rides out the
      # chain-bridge queue wait instead of thrashing.
      AGGREGATOR_MINT_REPLY_TIMEOUT_SECS: ${AGGREGATOR_MINT_REPLY_TIMEOUT_SECS:-120}
      # IoT gateway TLS: encrypts DLMS/COSEM meter telemetry in transit. Server cert
      # SAN covers `aggregator-bridge` (run `just gen-certs`). Unset both to fall back
      # to plaintext HTTP.
      IOT_GATEWAY_TLS_CERT: ${IOT_GATEWAY_TLS_CERT-/app/infra/certs/aggregator-bridge.crt}
      IOT_GATEWAY_TLS_KEY: ${IOT_GATEWAY_TLS_KEY-/app/infra/certs/aggregator-bridge.key}
      # mTLS: require + verify a client cert (the simulator's) against this CA —
      # transport-layer auth on top of the API key. Empty = server-auth TLS only
      # (default); set to /app/infra/certs/ca.crt to require client certs.
      IOT_GATEWAY_TLS_CLIENT_CA: ${IOT_GATEWAY_TLS_CLIENT_CA:-}
      # Vault Transit: unwrap per-meter rotated GUEK versions (key rotation). Unset
      # VAULT_ADDR to disable the versioned path (legacy unversioned key only).
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
      VAULT_METER_KEK_NAME: ${VAULT_METER_KEK_NAME:-gridtokenx-meter-kek}
      # Secure (locked-down) mode: neutralizes every ingest bypass — ignores the
      # AGGREGATOR_ALLOW_UNVERIFIED_TELEMETRY escape hatch, refuses the unsigned
      # `simulator` protocol, and requires an authenticated dlms-enc frame on the
      # meter path (no plaintext downgrade). Default off so dev/e2e keep bypasses.
      AGGREGATOR_REQUIRE_SECURE: ${AGGREGATOR_REQUIRE_SECURE:-false}
      # At-rest encryption of Redis stream payloads: AES-256-GCM the disseminated
      # DeviceReading with a Vault-KEK-wrapped fleet-wide SEK, so the full register
      # set is opaque in the zone/unified streams (the in-process ingester
      # decrypts). Needs Vault. Default off. Influx/Kafka unaffected (energy-only).
      AGGREGATOR_ENCRYPT_STREAMS: ${AGGREGATOR_ENCRYPT_STREAMS:-false}
      # Mirror each disseminated energy reading into the shared Postgres
      # meter_readings table (owner+wallet resolved inside the INSERT) so the
      # trading UI / meter-service dashboard can list Recent Readings. Otherwise
      # that table has no writer (telemetry lands only in Redis/Influx/Kafka).
      # Fire-and-forget; degrades to disabled if Postgres is unreachable.
      AGGREGATOR_PG_READINGS: ${AGGREGATOR_PG_READINGS:-true}
    volumes:
      - ./infra/aggregator-bridge/signing-key.bin:/app/aggregator-bridge-signing-key.bin:ro
      - ./infra/certs/ca.crt:/app/infra/certs/ca.crt:ro
      - ./infra/certs/clients/aggregator-bridge.crt:/app/infra/certs/client.crt:ro
      - ./infra/certs/clients/aggregator-bridge.key:/app/infra/certs/client.key:ro
      - ./infra/certs/aggregator-bridge.crt:/app/infra/certs/aggregator-bridge.crt:ro
      - ./infra/certs/aggregator-bridge.key:/app/infra/certs/aggregator-bridge.key:ro
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nats:
        condition: service_healthy
      kafka-market:
        condition: service_healthy
      aggregator-influxdb:
        condition: service_healthy
    networks:
      - gridtokenx-network
      - edge-tier
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    healthcheck:
      # IoT gateway terminates TLS (IOT_GATEWAY_TLS_CERT/KEY) → :4010 is HTTPS with a
      # self-signed dev cert. busybox-static wget can't verify it (no --no-check-certificate),
      # so probe TCP liveness instead: nc reads EOF from /dev/null, connects, exits 0 if the
      # listener is up. Works for plaintext fallback too (TCP connect succeeds either way).
      test: ["CMD", "/usr/bin/busybox", "sh", "-c", "/usr/bin/busybox nc -w 3 127.0.0.1 4010 </dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # Independent InfluxDB v2 — realtime telemetry history for the Aggregator
  # Bridge ONLY. Dedicated instance; not shared with any other service.
  aggregator-influxdb:
    image: influxdb:2.7
    container_name: gridtokenx-aggregator-influxdb
    security_opt:
      - no-new-privileges:true
    ports:
      - "${AGGREGATOR_INFLUXDB_PORT:-8087}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${AGGREGATOR_INFLUXDB_USER:-gridtokenx}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${AGGREGATOR_INFLUXDB_PASSWORD:-aggregator-influx-dev-pw}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-gridtokenx}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-aggregator_telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${AGGREGATOR_INFLUXDB_TOKEN:-aggregator-bridge-dev-token}
    volumes:
      - aggregator-influxdb-data:/var/lib/influxdb2
      - aggregator-influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - gridtokenx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 384M

  noti-service:
    build:
      context: ./
      dockerfile: gridtokenx-noti-service/Dockerfile
    container_name: gridtokenx-noti-service
    security_opt:
      - no-new-privileges:true
    ports:
      - "${NOTI_HTTP_PORT:-4060}:8080"
      - "${NOTI_GRPC_PORT:-5060}:8090"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      # Routed through PgDog (Rust pooler) instead of PgBouncer — pgdog:6432
      # fronts the noti-service's own physical database `gridtokenx_noti`
      # (a separate DB on the shared Postgres primary, NOT a schema).
      DATABASE_URL: postgres://gridtokenx_user:gridtokenx_password@pgdog:6432/gridtokenx_noti
      # sqlx::migrate! at startup uses a dedicated session-mode pooler alias so
      # its advisory lock can't leak into the transaction-mode pool above.
      MIGRATION_DATABASE_URL: postgres://gridtokenx_user:gridtokenx_password@pgdog:6432/gridtokenx_noti_migrate
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka-cmd:9001
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-gridtokenx}:${RABBITMQ_DEFAULT_PASS:-rabbitmq_secret_2025}@rabbitmq:5672
      PORT: 8080
      RUST_LOG: debug
      JWT_SECRET: ${JWT_SECRET}
      # Honour the dev gateway secret injected by APISIX; without this the
      # blockchain-auth RBAC fails closed and denies every ApiGateway request.
      CHAIN_BRIDGE_INSECURE: "${CHAIN_BRIDGE_INSECURE:-false}"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TLS_MODE: none
      SMTP_FROM: noreply@gridtokenx.com
      EMAIL_FROM_NAME: GridTokenX
      NTP_SERVERS: ${NTP_SERVERS:-time.cloudflare.com:123,time.google.com:123}
      EMAIL_FROM_ADDRESS: noreply@gridtokenx.com
      # Base URL for links in outbound emails (verify, password reset).
      # Must be reachable from the recipient's browser — the trading UI host port.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${TRADING_UI_PORT:-11001}}
      CERT_FILE: /app/infra/certs/server.crt
      KEY_FILE: /app/infra/certs/server.key
    volumes:
      - ./infra/certs/server.crt:/app/infra/certs/server.crt:ro
      - ./infra/certs/server.key:/app/infra/certs/server.key:ro
    depends_on:
      pgdog:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gridtokenx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "/usr/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # THBC Settlement Service — the payment leg (fiat on/off-ramp, inventory exchange).
  #
  # DESIGN + SIMULATION. No fiat is held and no fiat rail exists. Defaults to
  # THBC_LEDGER_MODE=simulated because `chain-bridge` would return 501 for most of
  # the payment leg — issue_thbc, redeem_thbc_for_fiat, the deposit nullifier and
  # the redemption escrow do not exist in the treasury program (spec §12). The
  # service reports `simulated_ledger: true` on /health and on every response, and
  # logs its posture at startup, so simulated state can't be mistaken for live.
  # Authoritative invariant status: GET /v1/admin/invariants.
  thbc-service:
    build:
      # Repo-root context: thbc-ledger takes a path dependency on
      # gridtokenx-blockchain-core/crates/blockchain-types for the chain.tx.* wire
      # schema and envelope signing, so cargo must see that sibling submodule.
      # (It stays chain-light — that crate carries no solana-sdk/anchor/SPL/tonic.)
      context: ./
      dockerfile: gridtokenx-thbc-service/Dockerfile
    container_name: gridtokenx-thbc-service
    security_opt:
      - no-new-privileges:true
    # NO host port published — the admin surface is internal-access-only.
    #
    # `require_admin_role` (thbc-api/src/admin.rs:66) is a misrouting guard, NOT
    # authentication: it only checks the `x-gridtokenx-user-role: admin` header,
    # which any client addressing the container directly can forge. Verified
    # 2026-08-01 — with `4070:4008` published, an unauthenticated curl from the
    # host got 403 without the header and **200 with a forged one**, reading the
    # full reserve/reconciliation surface and reaching the operator POSTs.
    #
    # The real gates live on APISIX route 61 (apisix_conf/apisix.yaml:548-562):
    # `ip-restriction` to internal CIDRs plus `plugin_config 2` (IAM JWT,
    # role == admin). Publishing a host port routed around both. Reaching the
    # service only over the compose network makes the gateway the sole ingress.
    #
    # To debug locally, prefer `docker exec gridtokenx-thbc-service` or go through
    # the gateway. If you must publish, bind loopback only — `127.0.0.1:4070:4008`
    # — and never 0.0.0.0, which exposes a forgeable admin header to the LAN.
    expose:
      - "4008"
    environment:
      THBC_HTTP_PORT: 4008
      THBC_LEDGER_MODE: ${THBC_LEDGER_MODE:-simulated}
      # Own physical database — NOT the shared `gridtokenx`. Deliberately named
      # THBC_DATABASE_URL, not DATABASE_URL: the root .env sets DATABASE_URL to the
      # shared database, and the service refuses to start if pointed at it.
      THBC_DATABASE_URL: postgres://${POSTGRES_USER:-gridtokenx_user}:${POSTGRES_PASSWORD:-gridtokenx_password}@pgdog:6432/gridtokenx_thbc
      # sqlx::migrate! holds a session-scoped advisory lock, which the transaction-mode
      # pool above would break. Session-mode alias, same physical DB.
      THBC_MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-gridtokenx_user}:${POSTGRES_PASSWORD:-gridtokenx_password}@pgdog:6432/gridtokenx_thbc_migrate
      # Chain Bridge is the only route to Solana; no service holds an RPC client.
      NATS_URL: ${NATS_URL:-nats://gridtokenx:gridtokenx_nats_dev@nats:4222}
      CHAIN_BRIDGE_GRPC_URL: http://chain-bridge:5040
      # Treasury account addresses for LedgerPort::snapshot, read over
      # chain.query.account (plain NATS request/reply). Configured rather than
      # derived: PDA derivation needs the off-curve check and therefore
      # curve25519, which would breach this service's chain-light property.
      # Leaving them unset makes snapshot() Unsupported — the honest outcome,
      # since a snapshot read from a guessed address would report a confident,
      # wrong F1 ceiling. These are the localnet PDAs for treasury program
      # FfxSQYKUmx9NGdCC9TDPmZSYjWYE1h4ruu3JatzHN5Tn.
      THBC_TREASURY_PDA: ${THBC_TREASURY_PDA:-6wnBBc6MzpvwFFKEHmAZRRn4xms8WYdrHGcEEHtPLDpj}
      THBC_INVENTORY_VAULT: ${THBC_INVENTORY_VAULT:-BwdbmMzZrjrjuyobmceiAwKkqABXrRnxM9FKEHkg8XxQ}
      # Envelope signing for chain.tx.issuethbc / chain.tx.attest. The bridge
      # force-signs both subjects (issuance moves value; attestation raises the
      # ceiling F1 enforces), verifying cert → CA → SPIFFE SAN == service_identity
      # → signature. Without this cert material every write is rejected there.
      THBC_SERVICE_IDENTITY: spiffe://gridtokenx.th/prod/thbc-service
      CHAIN_BRIDGE_CLIENT_CERT: /app/infra/certs/thbc-service.crt
      CHAIN_BRIDGE_CLIENT_KEY: /app/infra/certs/thbc-service.key
      # Δ — reclaim window for an unconfirmed redemption (F7).
      THBC_REDEMPTION_DELTA_SECS: ${THBC_REDEMPTION_DELTA_SECS:-86400}
      # F5 — attestation age past which issuance halts.
      THBC_ATTESTATION_TTL_SECS: ${THBC_ATTESTATION_TTL_SECS:-3600}
      # Simulation only. 1_000_000_000_000 minor units = 1,000,000 THB.
      THBC_SIMULATED_RESERVE_MINOR: ${THBC_SIMULATED_RESERVE_MINOR:-1000000000000}
      # Stub screener ceiling — deposits above it fail KYC, so the §5.4 encumbrance
      # path is reachable. There is no real KYC adapter.
      THBC_STUB_KYC_CEILING_MINOR: ${THBC_STUB_KYC_CEILING_MINOR:-500000000000}
      RUST_LOG: ${THBC_RUST_LOG:-info,thbc_service=debug,thbc_logic=debug}
      TZ: ${TZ}
    volumes:
      # Client identity for envelope signing. Generated by `just gen-certs`;
      # without them the service starts but every chain write is rejected at the
      # bridge, which force-signs both subjects it publishes to.
      - ./infra/certs/clients/thbc-service.crt:/app/infra/certs/thbc-service.crt:ro
      - ./infra/certs/clients/thbc-service.key:/app/infra/certs/thbc-service.key:ro
    depends_on:
      pgdog:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - gridtokenx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      # /health is liveness only. /ready reports issuance_open, which is false on a
      # stale attestation or exhausted headroom — expected operating states, not
      # faults, so gating readiness on it would take the regulator read surface down
      # along with issuance.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  erp-bridge:
    build:
      # Repo-root context: erp-api takes a path dependency on the sibling
      # gridtokenx-telemetry submodule. It deliberately does NOT need
      # gridtokenx-blockchain-core — if this build ever starts asking for it,
      # the direction invariant has been broken, not the Dockerfile.
      context: ./
      dockerfile: gridtokenx-erp-bridge/Dockerfile
    container_name: gridtokenx-erp-bridge
    security_opt:
      - no-new-privileges:true
    ports:
      # HTTP admin/health. The gRPC + SPIFFE mTLS surface is phase 2, so these
      # endpoints are unauthenticated — do not publish this port past the mesh.
      - "${ERP_BRIDGE_PORT:-5050}:5050"
    environment:
      ERP_BRIDGE_GRPC_ADDR: 0.0.0.0:5050
      # Own physical database. No JOINs to `users` or any other service's tables.
      DATABASE_URL: postgres://${POSTGRES_USER:-gridtokenx_user}:${POSTGRES_PASSWORD:-gridtokenx_password}@pgdog:6432/erp_bridge
      # sqlx::migrate! holds a session-scoped advisory lock that the pgdog
      # transaction-mode pool would break. Session-mode alias, same physical DB.
      ERP_MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-gridtokenx_user}:${POSTGRES_PASSWORD:-gridtokenx_password}@pgdog:6432/erp_bridge_migrate
      ERP_ADAPTER: ${ERP_ADAPTER:-mock}
      ERP_ADAPTER_DRY_RUN: ${ERP_ADAPTER_DRY_RUN:-true}
      ERP_UTILITY: ${ERP_UTILITY:-MEA}
      ERP_ENCRYPTION_SECRET: ${ERP_ENCRYPTION_SECRET:-dev_only_change_me_0123456789abcdef}
      ERP_FICA_POSTING_ENABLED: ${ERP_FICA_POSTING_ENABLED:-false}
      REC_ADAPTER_ENABLED: ${REC_ADAPTER_ENABLED:-false}
      REC_NET_BILLING_FEED_AVAILABLE: ${REC_NET_BILLING_FEED_AVAILABLE:-false}
      ERP_RECON_TOLERANCE_KWH: ${ERP_RECON_TOLERANCE_KWH:-0.01}
      # meter.readings lives on the MARKET cluster — that is where the
      # Aggregator Bridge publishes it (see its KAFKA_BOOTSTRAP_SERVERS +
      # KAFKA_TOPIC_METER_READINGS above). Pointing this at kafka-cmd would
      # subscribe successfully to a topic that never receives a reading, which
      # looks identical to "no meters are reporting".
      #
      # DISABLED BY DEFAULT — the two schemas do not overlap, so this consumer
      # cannot process a single message and never could:
      #   producer  MeterReadingEvent   (aggregator-persistence/src/infra/kafka.rs)
      #             meter_id, timestamp, energy_generated, energy_consumed, surplus, …
      #   consumer  MeterReadingWire    (erp-api/src/ingest.rs)
      #             requires pod, window_start_ms, cumulative_kwh, delta_kwh, meter_clock_ts
      # Not one of those five required fields (nor any of their aliases) exists on
      # the wire; `signature` is the only field the two share. erp-api/src/ingest.rs
      # is explicit that its shape is "what this service needs from it, NOT a copy
      # of what it currently emits" — the upstream half was never built.
      #
      # Leaving it subscribed is not harmless: on a decode failure the consumer
      # deliberately does not commit (ingest.rs:264 — "a malformed message that we
      # skip is a settlement we silently dropped"), and with no dead-letter path
      # that is a poison pill. Observed on this stack: ~320 rejections/min, and
      # CURRENT-OFFSET '-' on every partition of meter.readings against log-ends of
      # 2.2k–10.3k — it has never committed an offset since the group was created.
      #
      # Re-enable with ERP_KAFKA_READING_BROKERS=kafka-market:9002 once the
      # producer emits the ERP schema. The natural source for the missing
      # cumulative register is the OBIS total (1.1.1.8.0.255) the Aggregator
      # Bridge already decodes into DeviceReading.metadata and then drops when it
      # builds MeterReadingEvent. Only this consumer is gated: KAFKA_AUDIT_BROKERS
      # is separate, so the PII-access audit sink and the NATS advisories are
      # unaffected (erp-api/src/{main.rs:69,startup.rs:63}).
      KAFKA_BOOTSTRAP_SERVERS: ${ERP_KAFKA_READING_BROKERS:-}
      # Audit has its own cluster, same as IAM / Trading / Aggregator Bridge.
      KAFKA_AUDIT_BROKERS: kafka-audit:9003
      ERP_KAFKA_GROUP_ID: erp-bridge-v1
      ERP_KAFKA_READING_TOPIC: meter.readings
      ERP_KAFKA_AUDIT_TOPIC: erp.audit.events
      # Publish-only, and only under `erp.`: export.done / export.failed /
      # recon.break. This service has no chain.tx.* publisher.
      NATS_URL: ${NATS_URL:-nats://gridtokenx:gridtokenx_nats_dev@nats:4222}
      RUST_LOG: ${ERP_RUST_LOG:-info,gridtokenx_erp_bridge=debug,erp_logic=debug,erp_persistence=debug}
      TZ: ${TZ}
    depends_on:
      pgdog:
        condition: service_healthy
      kafka-market:
        condition: service_started
      kafka-audit:
        condition: service_started
      nats:
        condition: service_started
    networks:
      - gridtokenx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      # /health is liveness and reports the gate state (adapter, dry_run, FI-CA,
      # REC). /ready covers the database only — an ERP outage must never take
      # this service out of rotation, because the outbox is what survives one.
      test: ["CMD", "busybox", "wget", "-qO-", "http://127.0.0.1:5050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Trading Platform (Next.js)
  trading-ui:
    build:
      context: ./gridtokenx-trading
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_MAPBOX_TOKEN=${NEXT_PUBLIC_MAPBOX_TOKEN:-pk.eyJ1IjoiMjQxMDcxNzMwMjAwMyIsImEiOiJjbW54ZXJrNTMwMXJ0MnFzYmNhdTdsMHpwIn0.UI7eEeQCjjUDpv0ZWfUk4w}
    container_name: gridtokenx-trading
    security_opt:
      - no-new-privileges:true
    labels:
      # Extra OrbStack domain: service is `trading-ui` but the intuitive URL is
      # trading.<project>.orb.local — serve both (502/NXDOMAIN reports otherwise).
      dev.orbstack.domains: trading.gridtokenx-coresystem.orb.local
    ports:
      - "${TRADING_UI_PORT:-11001}:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      TZ: ${TZ}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4001}
      NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4001}
      NEXT_PUBLIC_PYTH_PRICE_SERVICE_URL: ${NEXT_PUBLIC_PYTH_PRICE_SERVICE_URL}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-pk.eyJ1IjoiMjQxMDcxNzMwMjAwMyIsImEiOiJjbW54ZXJrNTMwMXJ0MnFzYmNhdTdsMHpwIn0.UI7eEeQCjjUDpv0ZWfUk4w}
    networks:
      - gridtokenx-network
    depends_on:
      iam-service:
        condition: service_healthy
      trading-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Block Explorer (Next.js) — Solana explorer UI
  explorer:
    build:
      context: ./gridtokenx-explorer
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SOLANA_RPC_HTTP: ${NEXT_PUBLIC_SOLANA_RPC_URL:-https://api.devnet.solana.com}
        NEXT_PUBLIC_DEFAULT_CLUSTER: ${SOLANA_CLUSTER:-devnet}
    container_name: gridtokenx-explorer
    security_opt:
      - no-new-privileges:true
    ports:
      - "${EXPLORER_PORT:-11002}:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ}
      # Runtime config — injected per request as window.__RUNTIME_CONFIG__ by
      # the explorer's root layout, so RPC/program-ID changes only need
      # `docker compose up -d explorer` (restart), NOT an image rebuild. The
      # NEXT_PUBLIC_* build args above remain only as fallback for old images.
      SOLANA_RPC_HTTP: ${NEXT_PUBLIC_SOLANA_RPC_URL:-http://localhost:8899}
      DEFAULT_CLUSTER: ${SOLANA_CLUSTER:-localnet}
      TRADING_PROGRAM_ID: ${SOLANA_TRADING_PROGRAM_ID:-}
      TOKEN_PROGRAM_ID: ${SOLANA_ENERGY_TOKEN_PROGRAM_ID:-}
      GOVERNANCE_PROGRAM_ID: ${SOLANA_GOVERNANCE_PROGRAM_ID:-}
      ORACLE_PROGRAM_ID: ${SOLANA_ORACLE_PROGRAM_ID:-}
      REGISTRY_PROGRAM_ID: ${SOLANA_REGISTRY_PROGRAM_ID:-}
      TREASURY_PROGRAM_ID: ${SOLANA_TREASURY_PROGRAM_ID:-}
      BLOCKBENCH_PROGRAM_ID: ${SOLANA_BLOCKBENCH_PROGRAM_ID:-}
    networks:
      - gridtokenx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Mailpit SMTP Server (Development Email Testing)
  mailpit:
    image: axllent/mailpit:v1.30.2
    container_name: gridtokenx-mailpit
    security_opt:
      - no-new-privileges:true
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP server
      - "${MAILPIT_WEB_PORT:-13060}:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: ${MP_MAX_MESSAGES}
      MP_DATABASE: ${MP_DATABASE}
      MP_SMTP_AUTH_ACCEPT_ANY: ${MP_SMTP_AUTH_ACCEPT_ANY}
      MP_SMTP_AUTH_ALLOW_INSECURE: ${MP_SMTP_AUTH_ALLOW_INSECURE}
      TZ: ${TZ}
    volumes:
      - mailpit_data:/data
    networks:
      - gridtokenx-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8025/api/v1/info",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
  # Smart Meter Simulator (Python/FastAPI)
  smartmeter-simulator:
    build:
      context: ./gridtokenx-smartmeter-simulator
      dockerfile: Dockerfile
    container_name: gridtokenx-smartmeter-simulator
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ}
      # Grid timezone the solar model reinterprets the sim clock-face into
      # (devices/solar.py). Default Asia/Bangkok. Override to force the current
      # wall-clock instant into solar daytime for a fresh-mint demo without
      # moving the emit clock (bins stay current-dated → settlement still fires):
      # e.g. SMARTMETER_TIMEZONE=Etc/GMT+3 maps 02:xxZ → ~noon. Revert to default.
      TIMEZONE: ${SMARTMETER_TIMEZONE:-Asia/Bangkok}
      PORT: 8082
      LOG_LEVEL: INFO
      PYTHONPATH: /app:/app/src
      AUTOSTART_SIMULATION: "true"
      METRICS_PORT: 9091
      # Sim clock start (ISO-8601). Empty → engine falls back to TODAY 08:00 UTC
      # (real-world wall-clock day), instead of the image-baked fixed date. Set a
      # pinned value via SMARTMETER_SIM_START_TIME only for byte-identical replay.
      SIMULATION_START_TIME: ${SMARTMETER_SIM_START_TIME:-}
      # DLMS/COSEM REST egress to the Aggregator Bridge IoT gateway. In-network
      # the bridge ingest is aggregator-bridge:4010 (host maps it to :4030). TLS:
      # the bridge serves HTTPS (IOT_GATEWAY_TLS_*); AGGREGATOR_TLS_CA points httpx
      # at the dev CA so cert verification passes (SAN = aggregator-bridge).
      AGGREGATOR_BRIDGE_URL: https://aggregator-bridge:4010
      AGGREGATOR_TLS_CA: /app/infra/certs/ca.crt
      # mTLS client cert the sim presents when the bridge requires client auth.
      # Harmless when the bridge only does server-auth TLS (server ignores it).
      AGGREGATOR_TLS_CLIENT_CERT: ${AGGREGATOR_TLS_CLIENT_CERT:-/app/infra/certs/smartmeter-simulator.crt}
      AGGREGATOR_TLS_CLIENT_KEY: ${AGGREGATOR_TLS_CLIENT_KEY:-/app/infra/certs/smartmeter-simulator.key}
      AGGREGATOR_DLMS_ENABLED: ${SMARTMETER_DLMS_ENABLED:-true}
      # AES-256-GCM per-meter payload encryption (DLMS security-suite aligned).
      # Off by default; the bridge accepts both plaintext and encrypted frames,
      # so flip this without lockstep once the bridge image carries the decrypt path.
      AGGREGATOR_ENCRYPT_ENABLED: ${SMARTMETER_ENCRYPT_ENABLED:-false}
      # Per-meter key rotation with Vault-KEK wrapping. Needs encryption on + Vault.
      # Each meter gets a random GUEK wrapped by the Transit KEK; only the wrapped
      # blob is seeded to Redis, frames carry a key version (kid), and keys rotate
      # via POST /api/v1/simulation/keys/rotate.
      AGGREGATOR_KEY_ROTATION_ENABLED: ${SMARTMETER_KEY_ROTATION_ENABLED:-false}
      # Key versions kept live (current + prior) before pruning the wrapped blob
      # from Redis; the prior ones are the grace window for in-flight frames.
      AGGREGATOR_KEY_GRACE_VERSIONS: ${SMARTMETER_KEY_GRACE_VERSIONS:-2}
      # Background auto-rotation interval (seconds). 0 = manual rotate only.
      AGGREGATOR_KEY_ROTATION_INTERVAL_S: ${SMARTMETER_KEY_ROTATION_INTERVAL_S:-0}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
      VAULT_METER_KEK_NAME: ${VAULT_METER_KEK_NAME:-gridtokenx-meter-kek}
      # X-API-KEY for the bridge ingest endpoint; must match one of the bridge's
      # GRIDTOKENX_API_KEYS (api_key_auth rejects unauthenticated ingest with 401).
      AGGREGATOR_API_KEY: ${SMARTMETER_AGGREGATOR_API_KEY:-engineering-department-api-key-2025}
      # Bridge meter-pubkey registry. In-network Redis is redis:6379.
      REDIS_URL: redis://redis:6379
      # IAM onboarding (register->login->claim) via the APISIX user gateway.
      IAM_GATEWAY_URL: http://apisix:9080
      AGGREGATOR_IAM_ONBOARD_ENABLED: ${SMARTMETER_IAM_ONBOARD_ENABLED:-false}
      # PostGIS persistence of per-tick readings. Routed through pgdog.
      POSTGIS_URL: postgresql://gridtokenx_user:gridtokenx_password@pgdog:6432/gridtokenx
      POSTGIS_ENABLED: ${SMARTMETER_POSTGIS_ENABLED:-false}
    ports:
      - "${SMARTMETER_PORT:-8082}:8082" # REST API + /docs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      aggregator-bridge:
        condition: service_healthy
    volumes:
      - ./gridtokenx-smartmeter-simulator/data:/app/data
      - ./gridtokenx-smartmeter-simulator/backend/src/smart_meter_simulator:/app/src/smart_meter_simulator:rw
      - ./infra/certs/ca.crt:/app/infra/certs/ca.crt:ro
      - ./infra/certs/clients/smartmeter-simulator.crt:/app/infra/certs/smartmeter-simulator.crt:ro
      - ./infra/certs/clients/smartmeter-simulator.key:/app/infra/certs/smartmeter-simulator.key:ro
    networks:
      - gridtokenx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/v1/quality/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          # Cap CPU: the autostarted sim firehose otherwise pegs the VM (loadavg
          # >30 on 8 cores), starving kafka-market's single-node raft heartbeat
          # → controller REQUEST_TIMED_OUT → producer MessageTimedOut flood.
          cpus: "1.5"
          memory: 512M
        reservations:
          memory: 128M

  # Smart Meter Simulator UI (React/Next.js Static)
  smartmeter-ui:
    build:
      context: ./gridtokenx-smartmeter-simulator/frontend
      dockerfile: Dockerfile
      args:
        SIMULATOR_URL: http://smartmeter-simulator:8082
    container_name: gridtokenx-smartmeter-ui
    security_opt:
      - no-new-privileges:true
    environment:
      - NEXT_PUBLIC_SIMULATOR_URL=http://apisix.gridtokenx-coresystem.orb.local
      # Server-side rewrite target (next.config rewrites /api -> backend).
      - SIMULATOR_URL=http://smartmeter-simulator:8082
    ports:
      - "${SMARTMETER_UI_PORT:-12011}:3000" # Next.js dashboard
    depends_on:
      smartmeter-simulator:
        condition: service_healthy
    networks:
      - gridtokenx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 96M

  # ============================================
  # Monitoring Stack: Prometheus + Grafana
  # ============================================

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: gridtokenx-prometheus
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PROMETHEUS_PORT:-6001}:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring:/etc/prometheus/rules:ro
      # mTLS client identity for scraping the aggregator-bridge /metrics gateway.
      # reporting-service = a read-only observer cert (any CA-signed client passes
      # IOT_GATEWAY_TLS_CLIENT_CA). The top-level client.crt/key are 0-byte placeholders.
      - ./infra/certs/ca.crt:/etc/prometheus/certs/ca.crt:ro
      - ./infra/certs/clients/reporting-service.crt:/etc/prometheus/certs/client.crt:ro
      - ./infra/certs/clients/reporting-service.key:/etc/prometheus/certs/client.key:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--enable-feature=remote-write-receiver"
    networks:
      - gridtokenx-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          # cpus cap: prometheus scrape/eval grabbed unbounded CPU under load,
          # starving app services (chain-bridge NATS consumer aged mints -> DLQ).
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 256M

  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: gridtokenx-postgres-exporter
    security_opt:
      - no-new-privileges:true
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgdog:6432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"
    networks:
      - gridtokenx-network
    depends_on:
      pgdog:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:v1.86.0
    container_name: gridtokenx-redis-exporter
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"
    networks:
      - gridtokenx-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # Kafka Exporter
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: gridtokenx-kafka-exporter
    security_opt:
      - no-new-privileges:true
    command:
      [
        "--kafka.server=kafka-cmd:9001",
        "--kafka.server=kafka-market:9002",
        "--kafka.server=kafka-audit:9003",
      ]
    ports:
      - "${KAFKA_EXPORTER_PORT:-9308}:9308"
    networks:
      - gridtokenx-network
    depends_on:
      kafka-cmd:
        condition: service_healthy
      kafka-market:
        condition: service_healthy
      kafka-audit:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # Node Exporter (Host Metrics)
  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: gridtokenx-node-exporter
    security_opt:
      - no-new-privileges:true
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    networks:
      - gridtokenx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # cAdvisor (Container Metrics)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: gridtokenx-cadvisor
    # no-new-privileges intentionally omitted: cadvisor runs privileged (below)
    # to read host cgroups/devices; the two options are contradictory.
    ports:
      - "${CADVISOR_PORT:-6010}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - gridtokenx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # cpus cap: cadvisor at 80% just to monitor (privileged) is pure
          # overhead; bound it so it never competes with app services.
          cpus: "0.5"
          memory: 256M

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:11.5.0
    container_name: gridtokenx-grafana
    security_opt:
      - no-new-privileges:true
    ports:
      - "${GRAFANA_PORT:-6002}:3000" # Grafana HTTP
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:6002
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - gridtokenx-network
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # cpus cap: grafana dashboard eval spiked to 120%; bound it in dev.
          cpus: "0.75"
          memory: 512M
        reservations:
          memory: 128M

  # Loki — log aggregation (single-binary, filesystem storage, 14d retention).
  loki:
    image: grafana/loki:3.4.2
    container_name: gridtokenx-loki
    security_opt:
      - no-new-privileges:true
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "${LOKI_PORT:-6003}:3100"
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - gridtokenx-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3100/ready",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          # cpus cap: loki ingestion at 115%; bound so it never starves app services.
          cpus: "0.75"
          memory: 512M
        reservations:
          memory: 128M

  # Alloy — ships Docker container logs to Loki via the Docker socket API.
  alloy:
    image: grafana/alloy:v1.9.1
    container_name: gridtokenx-alloy
    security_opt:
      - no-new-privileges:true
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gridtokenx-network
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    # Alloy drains per-container log tails on SIGTERM; default 10s grace
    # ends in SIGKILL (exit 137) that reads like an OOM. Give it time.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          # cpus cap: alloy log shipping; bound in dev.
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

  # Tempo — distributed tracing backend. Receives OTLP (gRPC 4317 / HTTP 4318),
  # generates service-graph + span metrics and remote-writes them to Prometheus.
  tempo:
    image: grafana/tempo:2.7.2
    container_name: gridtokenx-tempo
    security_opt:
      - no-new-privileges:true
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "${TEMPO_HTTP_PORT:-6004}:3200" # Tempo query API
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - gridtokenx-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3200/ready",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          # cpus cap: tempo (incl. metrics_generator) spiked to 136% under span
          # volume; bound so trace ingest never starves the mint path it traces.
          cpus: "1.0"
          # 512M starved the metrics_generator under sustained span volume (the
          # continuous mint path), causing a generator deadline -> restart loop.
          memory: 1024M
        reservations:
          memory: 256M

  # HashiCorp Vault (Security Plane)
  vault:
    image: hashicorp/vault:1.15
    container_name: gridtokenx-vault
    # no-new-privileges intentionally omitted: the vault binary carries the
    # cap_ipc_lock file capability (mlock); no_new_privs blocks file-cap grants
    # on exec and would break startup.
    ports:
      - "${VAULT_PORT:-13001}:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    networks:
      - gridtokenx-network
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # OpenADR 3 VTN (openleadr-rs) — local demand-response test target for the
  # Aggregator Bridge's "openleadr" dispatch adapter (OPENLEADR_VTN_URL).
  # Built from the upstream tag matching the openleadr-client/-wire crate
  # versions pinned in gridtokenx-aggregator-bridge (0.2.4).
  openleadr-vtn:
    build:
      context: https://github.com/OpenLEADR/openleadr-rs.git#v0.2.4
      dockerfile: vtn.Dockerfile
    container_name: gridtokenx-openleadr-vtn
    security_opt:
      - no-new-privileges:true
    ports:
      - "${OPENLEADR_VTN_PORT:-4031}:3000"
    environment:
      RUST_LOG: openleadr_vtn=info
      # Internal OAuth provider; URL is container-internal (port 3000).
      OAUTH_TOKEN_URL: http://localhost:3000/auth/token
      DATABASE_URL: postgres://openadr:${OPENLEADR_PG_PASSWORD:-openadr}@openleadr-vtn-db:5432/openadr
    networks:
      - gridtokenx-network
    depends_on:
      openleadr-vtn-db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 96M

  openleadr-vtn-db:
    image: postgres:17-alpine
    container_name: gridtokenx-openleadr-vtn-db
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: openadr
      POSTGRES_DB: openadr
      POSTGRES_PASSWORD: ${OPENLEADR_PG_PASSWORD:-openadr}
      TZ: ${TZ}
    ports:
      - "${OPENLEADR_PG_PORT:-7030}:5432"
    networks:
      - gridtokenx-network
    volumes:
      - openleadr_vtn_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openadr"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 96M

  # One-shot seeder: waits for the VTN to run its own migrations on boot, then
  # inserts the default dev OAuth clients (bl-client / ven-client) idempotently.
  openleadr-vtn-seed:
    image: postgres:17-alpine
    container_name: gridtokenx-openleadr-vtn-seed
    security_opt:
      - no-new-privileges:true
    environment:
      PGPASSWORD: ${OPENLEADR_PG_PASSWORD:-openadr}
    volumes:
      - ./scripts/openleadr-vtn/seed-users.sql:/seed-users.sql:ro
    networks:
      - gridtokenx-network
    depends_on:
      openleadr-vtn:
        condition: service_started
    entrypoint: >-
      sh -c 'i=0;
      until psql -h openleadr-vtn-db -U openadr -d openadr -c "select 1 from \"user\" limit 1" >/dev/null 2>&1; do
        i=$$((i+1));
        if [ $$i -ge 60 ]; then echo "VTN migrations never appeared" >&2; exit 1; fi;
        sleep 2;
      done;
      psql -h openleadr-vtn-db -U openadr -d openadr -v ON_ERROR_STOP=1 -f /seed-users.sql'
    restart: "no"

networks:
  gridtokenx-network:
    driver: bridge
  user-tier:
    driver: bridge
  edge-tier:
    driver: bridge

volumes:
  iam_ows_vault:
    driver: local
  postgres_data:
  redis_data:
  mailpit_data:
  kafka_cmd_data:
  kafka_market_data:
  kafka_audit_data:
  rabbitmq_data:
  nats_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  openleadr_vtn_db_data:
  aggregator-influxdb-data:
  aggregator-influxdb-config:
